<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Basketball Passport</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
    box-sizing:border-box;
}

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

#map{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:1;
}


/* =========================
   BOTÓN BALÓN
========================= */

#menuButton{
    position:fixed;
    top:20px;
    left:20px;
    width:55px;
    height:55px;
    border:none;
    border-radius:50%;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    box-shadow:0 3px 12px rgba(0,0,0,.30);
    cursor:pointer;
    z-index:2000;
}


/* =========================
   MENÚ
========================= */

#sideMenu{
    position:fixed;
    top:0;
    left:-78%;
    width:75%;
    max-width:330px;
    height:100%;
    background:#f5f5f2;
    z-index:1900;
    transition:left .30s ease;
    box-shadow:4px 0 18px rgba(0,0,0,.25);
    padding:95px 22px 30px 22px;
}

#sideMenu.open{
    left:0;
}

.menu-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:6px;
}

.menu-subtitle{
    font-size:13px;
    color:#777;
    margin-bottom:30px;
}

.menu-item{
    display:flex;
    align-items:center;
    gap:15px;
    padding:15px 5px;
    color:#222;
    text-decoration:none;
    font-size:16px;
    border-bottom:1px solid #ddd;
}

.menu-icon{
    width:30px;
    text-align:center;
    font-size:22px;
}


/* =========================
   OVERLAY MENÚ
========================= */

#overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.25);
    z-index:1800;
    display:none;
}

#overlay.show{
    display:block;
}


/* =========================
   BALONES
========================= */

.basketball-marker{
    font-size:31px;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));
}


/* =========================
   POPUP
========================= */

.popup-cancha{
    width:220px;
    font-family:Arial,sans-serif;
}

.popup-foto{
    width:100%;
    height:125px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:10px;
    display:block;
}

.popup-nombre{
    font-size:17px;
    font-weight:bold;
    margin-bottom:5px;
}

.popup-ubicacion{
    font-size:13px;
    color:#666;
    margin-bottom:8px;
}

.popup-estrellas{
    font-size:16px;
    margin-bottom:11px;
}

.popup-boton{
    width:100%;
    border:none;
    border-radius:8px;
    padding:10px;
    background:#222;
    color:white;
    font-weight:bold;
    cursor:pointer;
}


/* =====================================================
   CELEBRACIÓN DE LOGRO
===================================================== */

#celebracionLogro{
    position:fixed;
    inset:0;
    z-index:10000;

    display:none;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:rgba(0,0,0,0);

    transition:
        background .45s ease;
}


#celebracionLogro.activa{
    display:flex;
}


#celebracionLogro.fondo{
    background:rgba(0,0,0,.32);
}


/* CONTENIDO CENTRAL */

.logro-contenido{
    position:relative;

    z-index:3;

    width:90%;
    max-width:430px;

    text-align:center;

    color:white;

    pointer-events:none;
}


/* STICKER */

.logro-sticker{
    font-size:105px;

    line-height:1;

    opacity:0;

    transform:
        scale(.05)
        rotate(-18deg);

    filter:
        drop-shadow(
            0 10px 10px
            rgba(0,0,0,.28)
        );
}


.logro-sticker.pegando{
    animation:
        pegarSticker
        .72s
        cubic-bezier(.18,.89,.32,1.35)
        forwards;
}


.logro-sticker.despegando{
    animation:
        despegarSticker
        .65s
        ease-in
        forwards;
}


@keyframes pegarSticker{

    0%{
        opacity:0;
        transform:
            scale(.05)
            rotate(-18deg);
    }

    55%{
        opacity:1;
        transform:
            scale(1.28)
            rotate(5deg);
    }

    75%{
        transform:
            scale(.92)
            rotate(-2deg);
    }

    100%{
        opacity:1;
        transform:
            scale(1)
            rotate(0deg);
    }

}


@keyframes despegarSticker{

    0%{
        opacity:1;
        transform:
            scale(1)
            rotate(0deg);
    }

    35%{
        transform:
            scale(1.08)
            rotate(-5deg);
    }

    100%{
        opacity:0;
        transform:
            scale(.15)
            rotate(22deg)
            translateY(-80px);
    }

}


/* TEXTO */

.logro-textos{
    margin-top:22px;

    opacity:0;

    transform:
        translateY(15px);

    transition:
        opacity .45s ease,
        transform .45s ease;
}


.logro-textos.visible{
    opacity:1;

    transform:
        translateY(0);
}


.logro-nuevo{
    font-size:14px;
    font-weight:bold;

    letter-spacing:3px;

    margin-bottom:10px;
}


.logro-titulo{
    font-size:32px;
    font-weight:900;

    letter-spacing:1px;

    margin-bottom:8px;
}


.logro-descripcion{
    font-size:18px;
    font-weight:bold;
}


/* =========================
   CONFETI
========================= */

.confeti{
    position:absolute;

    width:9px;
    height:15px;

    border-radius:2px;

    opacity:0;

    z-index:2;

    pointer-events:none;

    animation:
        caerConfeti
        var(--duracion)
        cubic-bezier(.2,.7,.3,1)
        forwards;

    animation-delay:
        var(--retraso);
}


@keyframes caerConfeti{

    0%{
        opacity:0;

        transform:
            translate(
                0,
                0
            )
            rotate(0deg);
    }

    10%{
        opacity:1;
    }

    35%{
        transform:
            translate(
                var(--x-medio),
                var(--y-subida)
            )
            rotate(240deg);
    }

    100%{
        opacity:0;

        transform:
            translate(
                var(--x-final),
                110vh
            )
            rotate(760deg);
    }

}


/* RESPETO A REDUCIR MOVIMIENTO */

@media (prefers-reduced-motion: reduce){

    .logro-sticker.pegando{
        animation:none;
        opacity:1;
        transform:none;
    }

    .logro-sticker.despegando{
        animation:none;
        opacity:0;
    }

    .confeti{
        display:none;
    }

}

</style>

</head>

<div id="map"></div>

<div id="overlay"></div>


<!-- =========================

========================= -->

<div

>

    <div class="logro-contenido">

</div>


<button

    type="button"

🏀
</button>

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://mybctirrilqkucnkaztx.supabase.co/";

const SUPABASE_KEY =
    "sb_publishable_tDdp8eOCmHOJJIfVm2WdHA_M3Q962Mc";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   MAPA
========================= */

const map =
    L.map(
        "map",
        {
            zoomControl:true,
            minZoom:5,
            maxZoom:18
        }
    ).setView(
        [7.5,-66],
        6
    );


L.tileLayer(

    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",

    {
        maxZoom:18,
        updateWhenIdle:true,
        keepBuffer:2,
        attribution:"© OpenStreetMap"
    }

).addTo(map);


/* =========================
   ICONO DE CANCHA
========================= */

const basketballIcon =
    L.divIcon({

        className:"",

        html:
            '<div class="basketball-marker">🏀</div>',

        iconSize:[40,40],

        iconAnchor:[20,20]

    });


/* =========================
   ABRIR CANCHA
========================= */

function abrirCancha(id) {

    localStorage.setItem(
        "canchaSeleccionada",
        id
    );

    window.location.href =
        "cancha.html";

}


/* =========================
   CONTENIDO DEL POPUP
========================= */

function contenidoPopup(
    cancha,
    urlFoto = ""
) {

    let foto = "";

    if (urlFoto) {

        foto = `

            <img
                src="${urlFoto}"
                class="popup-foto"
                alt="Foto de la cancha"
                onerror="this.style.display='none';"
            >

        `;

    }


    return `

        <div class="popup-cancha">

            ${foto}

            <div class="popup-nombre">
                ${cancha.nombre} 🏀
            </div>

            <div class="popup-ubicacion">
                📍 ${cancha.ubicacion}
            </div>

            <div class="popup-estrellas">

                ${"★".repeat(
                    Number(
                        cancha.estrellas || 0
                    )
                )}

            </div>

            <button
                class="popup-boton"
                onclick="abrirCancha('${cancha.id}')"
            >
                VER CANCHA →
            </button>

        </div>

    `;

}


/* =========================
   CARGAR CANCHAS
========================= */

async function cargarCanchas() {


    const {
        data: { session }
    } =
        await supabaseClient.auth
            .getSession();


    if (!session) {

        window.location.replace(
            "login.html"
        );

        return;

    }


    let canchas =
        JSON.parse(
            localStorage.getItem(
                "canchasBasketballPassport"
            )
        ) || [];


    /* CANCHA DE PRUEBA */

    if (canchas.length === 0) {

        canchas.push({

            id:Date.now(),

            nombre:"Cancha de prueba",

            ubicacion:"Caracas, Venezuela",

            estrellas:5,

            latitud:10.4806,

            longitud:-66.9036,

            fotoRuta:"",

            foto:""

        });


        localStorage.setItem(

            "canchasBasketballPassport",

            JSON.stringify(canchas)

        );

    }


    /* DIBUJAR CANCHAS */

    for (const cancha of canchas) {


        const lat =
            cancha.latitud ??
            cancha.lat;


        const lng =
            cancha.longitud ??
            cancha.logongitud ??
            cancha.lng;


        if (
            lat == null ||
            lng == null
        ) {

            continue;

        }


        const marcador =
            L.marker(

                [lat,lng],

                {
                    icon:
                        basketballIcon
                }

            ).addTo(map);


        marcador.bindPopup(
            contenidoPopup(
                cancha
            )
        );


        /* FOTO PRIVADA */

        if (
            cancha.fotoPath ||
            cancha.fotoRuta
        ) {

            const rutaFoto =
                cancha.fotoPath ||
                cancha.fotoRuta;


            const {
                data,
                error
            } =
                await supabaseClient.storage

                    .from(
                        "fotos-canchas"
                    )

                    .createSignedUrl(

                        rutaFoto,

                        3600

                    );


            if (
                !error &&
                data &&
                data.signedUrl
            ) {

                marcador.setPopupContent(

                    contenidoPopup(

                        cancha,

                        data.signedUrl

                    )

                );

            }

        }


        /* FOTO ANTIGUA */

        else if (cancha.foto) {


            marcador.setPopupContent(

                contenidoPopup(

                    cancha,

                    cancha.foto

                )

            );

        }

    }


    /* DESPUÉS DE CARGAR EL MAPA */

    comprobarCelebracionPendiente();

}


/* =========================
   INICIAR MAPA
========================= */

cargarCanchas();


/* =========================
   MENÚ
========================= */

const menuButton =
    document.getElementById(
        "menuButton"
    );

const sideMenu =
    document.getElementById(
        "sideMenu"
    );

const overlay =
    document.getElementById(
        "overlay"
    );


menuButton.onclick =
    function() {

        sideMenu.classList.toggle(
            "open"
        );

        overlay.classList.toggle(
            "show"
        );

    };


overlay.onclick =
    function() {

        sideMenu.classList.remove(
            "open"
        );

        overlay.classList.remove(
            "show"
        );

    };


/* =========================
   GALERÍA PENDIENTE
========================= */

document.getElementById(
    "galeriaPendiente"
).onclick =
    function(event) {

        event.preventDefault();

        alert(
            "📷 La galería estará disponible próximamente."
        );

    };


/* =========================
   AGREGAR CANCHA
========================= */

const agregarCancha =
    document.getElementById(
        "agregarCancha"
    );


agregarCancha.onclick =
    function(event) {


        event.preventDefault();


        sideMenu.classList.remove(
            "open"
        );

        overlay.classList.remove(
            "show"
        );


        alert(
            "📍 Busca la cancha en el mapa y toca su ubicación exacta."
        );


        map.once(

            "click",

            function(e) {


                const latitud =
                    e.latlng.lat;

                const longitud =
                    e.latlng.lng;


                const marcadorTemporal =
                    L.marker(

                        [
                            latitud,
                            longitud
                        ],

                        {

                            icon:
                                basketballIcon,

                            draggable:
                                true

                        }

                    ).addTo(map);


                marcadorTemporal.bindPopup(`

                    <div style="
                        text-align:center;
                        width:190px;
                        font-family:Arial,sans-serif;
                    ">

                        <strong>
                            🏀 Nueva cancha
                        </strong>

                        <p style="
                            font-size:13px;
                            margin:10px 0;
                        ">
                            ¿Es esta la ubicación correcta?
                        </p>


                        <button
                            id="confirmarUbicacion"
                            style="
                                width:100%;
                                border:none;
                                padding:10px;
                                margin-bottom:7px;
                                border-radius:8px;
                                background:#222;
                                color:white;
                                font-weight:bold;
                                cursor:pointer;
                            "
                        >
                            CONFIRMAR UBICACIÓN →
                        </button>


                        <button
                            id="quitarBalon"
                            style="
                                width:100%;
                                border:1px solid #ccc;
                                padding:8px;
                                border-radius:8px;
                                background:white;
                                color:#222;
                                cursor:pointer;
                            "
                        >
                            ✕ Quitar balón
                        </button>

                    </div>

                `);


                marcadorTemporal.openPopup();


                const popup =
                    marcadorTemporal
                        .getPopup()
                        .getElement();


                const botonQuitar =
                    popup.querySelector(
                        "#quitarBalon"
                    );


                const botonConfirmar =
                    popup.querySelector(
                        "#confirmarUbicacion"
                    );


                botonQuitar.onclick =
                    function() {

                        map.removeLayer(
                            marcadorTemporal
                        );

                    };


                botonConfirmar.onclick =
                    function() {


                        const posicion =
                            marcadorTemporal
                                .getLatLng();


                        localStorage.setItem(

                            "nuevaCanchaUbicacion",

                            JSON.stringify({

                                latitud:
                                    posicion.lat,

                                longitud:
                                    posicion.lng

                            })

                        );


                        window.location.href =
                            "agregar-cancha.html";

                    };

            }

        );

    };


/* =====================================================
   CELEBRACIÓN DE LOGRO
===================================================== */

function comprobarCelebracionPendiente() {

    const pendiente =
        localStorage.getItem(
            "celebracionPendienteBasketballPassport"
        );


    if (
        pendiente !==
        "explorador5"
    ) {

        return;

    }


    let celebrados =
        JSON.parse(
            localStorage.getItem(
                "logrosCelebradosBasketballPassport"
            )
        ) || [];


    if (
        celebrados.includes(
            "explorador5"
        )
    ) {

        localStorage.removeItem(
            "celebracionPendienteBasketballPassport"
        );

        return;

    }


    /*
       Esperamos un poquito para que
       primero aparezca el mapa.
    */

    setTimeout(

        function() {

            mostrarCelebracionExplorador();

        },

        650

    );

}


/* =========================
   MOSTRAR CELEBRACIÓN
========================= */

function mostrarCelebracionExplorador() {

    const celebracion =
        document.getElementById(
            "celebracionLogro"
        );

    const sticker =
        document.getElementById(
            "logroSticker"
        );

    const textos =
        document.getElementById(
            "logroTextos"
        );


    celebracion.classList.add(
        "activa"
    );

    celebracion.setAttribute(
        "aria-hidden",
        "false"
    );


    /*
       Forzamos un nuevo frame antes
       de oscurecer el fondo.
    */

    requestAnimationFrame(

        function() {

            requestAnimationFrame(

                function() {

                    celebracion.classList.add(
                        "fondo"
                    );

                }

            );

        }

    );


    /* CONFETI */

    crearConfeti();


    /* PEGAR STICKER */

    setTimeout(

        function() {

            sticker.classList.add(
                "pegando"
            );

        },

        250

    );


    /* MOSTRAR TEXTO */

    setTimeout(

        function() {

            textos.classList.add(
                "visible"
            );

        },

        850

    );


    /* DESPEGAR STICKER */

    setTimeout(

        function() {

            textos.classList.remove(
                "visible"
            );

            sticker.classList.remove(
                "pegando"
            );

            sticker.classList.add(
                "despegando"
            );

        },

        3400

    );


    /* QUITAR FONDO */

    setTimeout(

        function() {

            celebracion.classList.remove(
                "fondo"
            );

        },

        3800

    );


    /* TERMINAR */

    setTimeout(

        function() {

            celebracion.classList.remove(
                "activa"
            );

            celebracion.setAttribute(
                "aria-hidden",
                "true"
            );


            sticker.classList.remove(
                "despegando"
            );


            /*
               Marcamos el logro como
               celebrado para que jamás
               vuelva a salir.
            */

            let celebrados =
                JSON.parse(
                    localStorage.getItem(
                        "logrosCelebradosBasketballPassport"
                    )
                ) || [];


            if (
                !celebrados.includes(
                    "explorador5"
                )
            ) {

                celebrados.push(
                    "explorador5"
                );

            }


            localStorage.setItem(

                "logrosCelebradosBasketballPassport",

                JSON.stringify(
                    celebrados
                )

            );


            localStorage.removeItem(
                "celebracionPendienteBasketballPassport"
            );


            /*
               Eliminamos cualquier confeti
               restante del DOM.
            */

            celebracion
                .querySelectorAll(
                    ".confeti"
                )
                .forEach(
                    function(elemento) {

                        elemento.remove();

                    }
                );

        },

        4400

    );

}


/* =========================
   CREAR CONFETI
========================= */

function crearConfeti() {

    const celebracion =
        document.getElementById(
            "celebracionLogro"
        );


    const colores = [

        "#ff9f1c",
        "#ffd166",
        "#ffffff",
        "#4cc9f0",
        "#ef476f",
        "#06d6a0"

    ];


    /*
       28 piezas en total:
       14 desde cada lado.
    */

    const cantidadPorLado =
        14;


    for (
        let lado = 0;
        lado < 2;
        lado++
    ) {

        for (
            let i = 0;
            i < cantidadPorLado;
            i++
        ) {

            const pieza =
                document.createElement(
                    "div"
                );


            pieza.className =
                "confeti";


            const desdeIzquierda =
                lado === 0;


            pieza.style.left =
                desdeIzquierda
                ?
                "-10px"
                :
                "calc(100% + 10px)";


            /*
               Salen principalmente desde
               la zona media/baja.
            */

            pieza.style.top =
                (
                    42 +
                    Math.random() * 35
                ) +
                "%";


            pieza.style.background =
                colores[
                    Math.floor(
                        Math.random() *
                        colores.length
                    )
                ];


            const movimientoMedio =
                70 +
                Math.random() * 120;


            const movimientoFinal =
                120 +
                Math.random() * 180;


            pieza.style.setProperty(

                "--x-medio",

                (
                    desdeIzquierda
                    ?
                    movimientoMedio
                    :
                    -movimientoMedio
                ) +
                "px"

            );


            pieza.style.setProperty(

                "--x-final",

                (
                    desdeIzquierda
                    ?
                    movimientoFinal
                    :
                    -movimientoFinal
                ) +
                "px"

            );


            pieza.style.setProperty(

                "--y-subida",

                (
                    -80 -
                    Math.random() * 220
                ) +
                "px"

            );


            pieza.style.setProperty(

                "--duracion",

                (
                    2.4 +
                    Math.random() * 1.1
                ) +
                "s"

            );


            pieza.style.setProperty(

                "--retraso",

                (
                    Math.random() * .55
                ) +
                "s"

            );


            /*
               Algunas piezas cuadradas,
               otras un poco alargadas.
            */

            pieza.style.width =
                (
                    6 +
                    Math.random() * 5
                ) +
                "px";


            pieza.style.height =
                (
                    9 +
                    Math.random() * 9
                ) +
                "px";


            celebracion.appendChild(
                pieza
            );

        }

    }

}

    );


cerrarSesion.onclick =

        await supabaseClient.auth

        );

</script>
