<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Basketball Passport</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        #titulo {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            background: #f5f5f2;
        }

        #map {
            width: 100%;
            height: calc(100vh - 70px);
        }

        .basketball {
            font-size: 32px;
        }

    </style>

</head>

<body>

    <div id="titulo">
        🏀 BASKETBALL PASSPORT
    </div>

    <div id="map"></div>


    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <script>

        const map = L.map("map").setView(
            [7.5, -66.0],
            6
        );

        L.tileLayer(
            "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution: "© OpenStreetMap"
            }
        ).addTo(map);


        const basketballIcon = L.divIcon({
            className: "",
            html: '<div class="basketball">🏀</div>',
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        });


        L.marker(
            [10.4806, -66.9036],
            { icon: basketballIcon }
        )
        .addTo(map)
        .bindPopup(
            "<b>Cancha de prueba 🏀</b><br>Caracas, Venezuela"
        );

    </script>

</body>

</html>
