<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Basketball Passport</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
    box-sizing:border-box;
}

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

/* MAPA A PANTALLA COMPLETA */

#map{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:1;
}

/* BOTÓN BALÓN */

#menuButton{
    position:fixed;
    top:20px;
    left:20px;

    width:55px;
    height:55px;

    border:none;
    border-radius:50%;

    background:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:32px;

    box-shadow:0 3px 12px rgba(0,0,0,.30);

    cursor:pointer;

    z-index:2000;
}

/* MENÚ LATERAL */

#sideMenu{
    position:fixed;

    top:0;
    left:-78%;

    width:75%;
    max-width:330px;
    height:100%;

    background:#f5f5f2;

    z-index:1900;

    transition:left .30s ease;

    box-shadow:4px 0 18px rgba(0,0,0,.25);

    padding:95px 22px 30px 22px;
}

#sideMenu.open{
    left:0;
}

/* TITULO DEL MENU */

.menu-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:6px;
}

.menu-subtitle{
    font-size:13px;
    color:#777;
    margin-bottom:30px;
}

/* OPCIONES */

.menu-item{
    display:flex;
    align-items:center;

    gap:15px;

    padding:15px 5px;

    color:#222;

    text-decoration:none;

    font-size:16px;

    border-bottom:1px solid #ddd;
}

.menu-icon{
    width:30px;
    text-align:center;
    font-size:22px;
}

/* FONDO OSCURO AL ABRIR MENU */

#overlay{
    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.25);

    z-index:1800;

    display:none;
}

#overlay.show{
    display:block;
}

/* BALONES DEL MAPA */

.basketball-marker{
    font-size:31px;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));
}

</style>

</head>

<body>


<!-- MAPA -->

<div id="map"></div>


<!-- OSCURECIMIENTO AL ABRIR MENU -->

<div id="overlay"></div>


<!-- MENÚ LATERAL -->

<div id="sideMenu">

    <div class="menu-title">
        BASKETBALL PASSPORT
    </div>

    <div class="menu-subtitle">
        Every court tells a story.
    </div>


    <a class="menu-item" href="#">
        <span class="menu-icon">👤</span>
        Mi perfil
    </a>


    <a class="menu-item" href="#">
        <span class="menu-icon">🏀</span>
        Mis canchas
    </a>


    <a class="menu-item" href="#">
        <span class="menu-icon">📊</span>
        Partidos y estadísticas
    </a>


    <a class="menu-item" href="#">
        <span class="menu-icon">📷</span>
        Galería
    </a>


    <a class="menu-item" href="#" id="agregarCancha">
    <span class="menu-icon">➕</span>
    Agregar cancha
</a>

    <a class="menu-item" href="#">
        <span class="menu-icon">⚙️</span>
        Configuración
    </a>


    <a class="menu-item" href="login.html">
        <span class="menu-icon">↪️</span>
        Cerrar sesión
    </a>

</div>


<!-- BOTÓN PARA ABRIR MENU -->

<button id="menuButton">
🏀
</button>


<!-- LEAFLET -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =========================
   MAPA
========================= */

const map = L.map("map", {

    zoomControl:true,

    minZoom:5,

    maxZoom:18

}).setView(

    [7.5,-66],

    6

);


/* OPENSTREETMAP */

L.tileLayer(

    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        maxZoom:18,

        updateWhenIdle:true,

        keepBuffer:2,

        attribution:"© OpenStreetMap"

    }

).addTo(map);


/* =========================
   ICONO DE CANCHA
========================= */

const basketballIcon = L.divIcon({

    className:"",

    html:
    '<div class="basketball-marker">🏀</div>',

    iconSize:[40,40],

    iconAnchor:[20,20]

});


/* =========================
   CANCHAS GUARDADAS
========================= */

let canchas = JSON.parse(
    localStorage.getItem("canchasBasketballPassport")
) || [];

/* Si todavía no existe ninguna cancha,
   conservamos la cancha de prueba */
if (canchas.length === 0) {
    canchas.push({
        id: Date.now(),
        nombre: "Cancha de prueba",
        ubicacion: "Caracas, Venezuela",
        estrellas: 5,
        latitud: 10.4806,
        longitud: -66.9036
    });

    localStorage.setItem("canchasBasketballPassport", JSON.stringify(canchas));
}

/* Mostrar todas las canchas en el mapa */
canchas.forEach(function(cancha) {

    const lat = cancha.latitud ?? cancha.lat;
    const lng = cancha.longitud ?? cancha.logongitud ?? cancha.lng;

    if (lat == null || lng == null) {
        return;
    }

    const marcador = L.marker(
        [lat, lng],
        { icon: basketballIcon }
    ).addTo(map);

    marcador.bindPopup(`
        <div style="
            width:210px;
            font-family:Arial,sans-serif;
        ">

            <div style="
                font-size:17px;
                font-weight:bold;
                margin-bottom:4px;
            ">
                ${cancha.nombre} 🏀
            </div>

            <div style="
                font-size:13px;
                color:#666;
                margin-bottom:8px;
            ">
                📍 ${cancha.ubicacion}
            </div>

            <div style="
                font-size:16px;
                margin-bottom:10px;
            ">
                ${"★".repeat(Number(cancha.estrellas || 0))}
            </div>

            <button
                onclick="abrirCancha('${cancha.id}')"
                style="
                    width:100%;
                    border:none;
                    border-radius:8px;
                    padding:10px;
                    background:#222;
                    color:white;
                    font-weight:bold;
                    cursor:pointer;
                "
            >
                VER CANCHA →
            </button>

        </div>
    `);
});

function abrirCancha(id) {
    localStorage.setItem("canchaSeleccionada", id);
    window.location.href = "cancha.html";
}

/* =========================
   MENÚ LATERAL
========================= */

const menuButton = document.getElementById("menuButton");
const sideMenu = document.getElementById("sideMenu");
const overlay = document.getElementById("overlay");

menuButton.onclick = function () {
    sideMenu.classList.toggle("open");
    overlay.classList.toggle("show");
};

overlay.onclick = function () {
    sideMenu.classList.remove("open");
    overlay.classList.remove("show");
};

/* =========================
   AGREGAR CANCHA MANUALMENTE
========================= */

const agregarCancha = document.getElementById("agregarCancha");

agregarCancha.onclick = function (event) {
    event.preventDefault();

    // Cerrar menú
    sideMenu.classList.remove("open");
    overlay.classList.remove("show");

    // Avisar al usuario
    alert("📍 Busca la cancha en el mapa y toca su ubicación exacta.");

    // Esperar un toque en el mapa
    map.once("click", function(e) {

        const latitud = e.latlng.lat;
        const longitud = e.latlng.lng;

        // Colocar balón temporal
        const marcadorTemporal = L.marker(
            [latitud, longitud],
            { icon: basketballIcon, draggable: true }
        ).addTo(map);

      marcadorTemporal.bindPopup(`
    <div style="text-align:center; width:190px;">
        <strong>🏀 Nueva cancha</strong>

        <p style="font-size:13px;">
            ¿Es esta la ubicación correcta?
        </p>

        <button
            id="confirmarUbicacion"
            style="
                width:100%;
                border:none;
                padding:10px;
                margin-bottom:7px;
                border-radius:8px;
                background:#222;
                color:white;
                font-weight:bold;
                cursor:pointer;
            "
        >
            CONFIRMAR UBICACIÓN →
        </button>

        <button
            id="quitarBalon"
            style="
                width:100%;
                border:1px solid #ccc;
                padding:8px;
                border-radius:8px;
                background:white;
                color:#222;
                cursor:pointer;
            "
        >
            ✕ Quitar balón
        </button>
    </div>
`).openPopup();


/* BOTONES DEL BALÓN TEMPORAL */

const popup = marcadorTemporal.getPopup().getElement();

popup.querySelector("#quitarBalon").onclick = function () {
    map.removeLayer(marcadorTemporal);
};

popup.querySelector("#confirmarUbicacion").onclick = function () {

    const posicion = marcadorTemporal.getLatLng();

    localStorage.setItem(
        "nuevaCanchaUbicacion",
        JSON.stringify({
            latitud: posicion.lat,
            longitud: posicion.lng
        })
    );

    window.location.href = "agregar-cancha.html";
};
    .getPopup()
    .getElement()
    .querySelector("button");

botonQuitar._marcador = marcadorTemporal;

    });
};
</script>

</body>
</html>
