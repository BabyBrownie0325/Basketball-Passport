<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Basketball Passport</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
    box-sizing:border-box;
}

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

#map{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:1;
}

/* BOTÓN BALÓN */

#menuButton{
    position:fixed;
    top:20px;
    left:20px;
    width:55px;
    height:55px;
    border:none;
    border-radius:50%;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    box-shadow:0 3px 12px rgba(0,0,0,.30);
    cursor:pointer;
    z-index:2000;
}

/* MENÚ */

#sideMenu{
    position:fixed;
    top:0;
    left:-78%;
    width:75%;
    max-width:330px;
    height:100%;
    background:#f5f5f2;
    z-index:1900;
    transition:left .30s ease;
    box-shadow:4px 0 18px rgba(0,0,0,.25);
    padding:95px 22px 30px 22px;
}

#sideMenu.open{
    left:0;
}

.menu-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:6px;
}

.menu-subtitle{
    font-size:13px;
    color:#777;
    margin-bottom:30px;
}

.menu-item{
    display:flex;
    align-items:center;
    gap:15px;
    padding:15px 5px;
    color:#222;
    text-decoration:none;
    font-size:16px;
    border-bottom:1px solid #ddd;
}

.menu-icon{
    width:30px;
    text-align:center;
    font-size:22px;
}

/* OVERLAY */

#overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.25);
    z-index:1800;
    display:none;
}

#overlay.show{
    display:block;
}

/* BALONES */

.basketball-marker{
    font-size:31px;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));
}

/* POPUP */

.popup-cancha{
    width:220px;
    font-family:Arial,sans-serif;
}

.popup-foto{
    width:100%;
    height:125px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:10px;
    display:block;
}

.popup-nombre{
    font-size:17px;
    font-weight:bold;
    margin-bottom:5px;
}

.popup-ubicacion{
    font-size:13px;
    color:#666;
    margin-bottom:8px;
}

.popup-estrellas{
    font-size:16px;
    margin-bottom:11px;
}

.popup-boton{
    width:100%;
    border:none;
    border-radius:8px;
    padding:10px;
    background:#222;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

</style>

</head>

<body>

<div id="map"></div>

<div id="overlay"></div>


<!-- MENÚ -->

<div id="sideMenu">

    <div class="menu-title">
        BASKETBALL PASSPORT
    </div>

    <div class="menu-subtitle">
        Every court tells a story.
    </div>


    <a class="menu-item" href="perfil.html">
        <span class="menu-icon">👤</span>
        Mi perfil
    </a>


    <a class="menu-item" href="mis-canchas.html">
        <span class="menu-icon">🏀</span>
        Mis canchas
    </a>


    <a class="menu-item" href="estadisticas.html">
        <span class="menu-icon">📊</span>
        Partidos y estadísticas
    </a>


    <a class="menu-item" href="#" id="galeriaPendiente">
        <span class="menu-icon">📷</span>
        Galería
    </a>


    <a
        class="menu-item"
        href="#"
        id="agregarCancha"
    >
        <span class="menu-icon">➕</span>
        Agregar cancha
    </a>


    <a class="menu-item" href="configuracion.html">
        <span class="menu-icon">⚙️</span>
        Configuración
    </a>


    <a
        class="menu-item"
        href="#"
        id="cerrarSesion"
    >
        <span class="menu-icon">↪️</span>
        Cerrar sesión
    </a>

</div>


<button
    id="menuButton"
    type="button"
>
🏀
</button>


<!-- LEAFLET -->

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<!-- SUPABASE -->

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://mybctirrilqkucnkaztx.supabase.co/";

const SUPABASE_KEY =
    "sb_publishable_tDdp8eOCmHOJJIfVm2WdHA_M3Q962Mc";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   MAPA
========================= */

const map =
    L.map(
        "map",
        {
            zoomControl:true,
            minZoom:5,
            maxZoom:18
        }
    ).setView(
        [7.5,-66],
        6
    );


L.tileLayer(

    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",

    {
        maxZoom:18,
        updateWhenIdle:true,
        keepBuffer:2,
        attribution:"© OpenStreetMap"
    }

).addTo(map);


/* =========================
   ICONO DE CANCHA
========================= */

const basketballIcon =
    L.divIcon({

        className:"",

        html:
            '<div class="basketball-marker">🏀</div>',

        iconSize:[40,40],

        iconAnchor:[20,20]

    });


/* =========================
   ABRIR CANCHA
========================= */

function abrirCancha(id) {

    localStorage.setItem(
        "canchaSeleccionada",
        id
    );

    window.location.href =
        "cancha.html";

}


/* =========================
   CONTENIDO DEL POPUP
========================= */

function contenidoPopup(
    cancha,
    urlFoto = ""
) {

    let foto = "";

    if (urlFoto) {

        foto = `

            <img
                src="${urlFoto}"
                class="popup-foto"
                alt="Foto de la cancha"
                onerror="this.style.display='none';"
            >

        `;

    }


    return `

        <div class="popup-cancha">

            ${foto}

            <div class="popup-nombre">
                ${cancha.nombre} 🏀
            </div>

            <div class="popup-ubicacion">
                📍 ${cancha.ubicacion}
            </div>

            <div class="popup-estrellas">

                ${"★".repeat(
                    Number(
                        cancha.estrellas || 0
                    )
                )}

            </div>

            <button
                class="popup-boton"
                onclick="abrirCancha('${cancha.id}')"
            >
                VER CANCHA →
            </button>

        </div>

    `;

}


/* =========================
   CARGAR CANCHAS
========================= */

async function cargarCanchas() {


    const {
        data: { session }
    } =
        await supabaseClient.auth
            .getSession();


    if (!session) {

        window.location.replace(
            "login.html"
        );

        return;

    }


    let canchas =
        JSON.parse(
            localStorage.getItem(
                "canchasBasketballPassport"
            )
        ) || [];


    /* CANCHA DE PRUEBA */

    if (canchas.length === 0) {

        canchas.push({

            id:Date.now(),

            nombre:"Cancha de prueba",

            ubicacion:"Caracas, Venezuela",

            estrellas:5,

            latitud:10.4806,

            longitud:-66.9036,

            fotoRuta:"",

            foto:""

        });


        localStorage.setItem(

            "canchasBasketballPassport",

            JSON.stringify(canchas)

        );

    }


    /* DIBUJAR CANCHAS */

    for (const cancha of canchas) {


        const lat =
            cancha.latitud ??
            cancha.lat;


        const lng =
            cancha.longitud ??
            cancha.logongitud ??
            cancha.lng;


        if (
            lat == null ||
            lng == null
        ) {

            continue;

        }


        const marcador =
            L.marker(

                [lat,lng],

                {
                    icon:
                        basketballIcon
                }

            ).addTo(map);


        marcador.bindPopup(
            contenidoPopup(
                cancha
            )
        );


        /* FOTO PRIVADA */

        if (cancha.fotoRuta) {


            const {
                data,
                error
            } =
                await supabaseClient.storage

                    .from(
                        "fotos-canchas"
                    )

                    .createSignedUrl(

                        cancha.fotoRuta,

                        3600

                    );


            if (
                !error &&
                data &&
                data.signedUrl
            ) {

                marcador.setPopupContent(

                    contenidoPopup(

                        cancha,

                        data.signedUrl

                    )

                );

            }

        }


        /* FOTO ANTIGUA */

        else if (cancha.foto) {


            marcador.setPopupContent(

                contenidoPopup(

                    cancha,

                    cancha.foto

                )

            );

        }

    }

}


/* =========================
   INICIAR MAPA
========================= */

cargarCanchas();


/* =========================
   MENÚ
========================= */

const menuButton =
    document.getElementById(
        "menuButton"
    );

const sideMenu =
    document.getElementById(
        "sideMenu"
    );

const overlay =
    document.getElementById(
        "overlay"
    );


menuButton.onclick =
    function() {

        sideMenu.classList.toggle(
            "open"
        );

        overlay.classList.toggle(
            "show"
        );

    };


overlay.onclick =
    function() {

        sideMenu.classList.remove(
            "open"
        );

        overlay.classList.remove(
            "show"
        );

    };


/* =========================
   GALERÍA PENDIENTE
========================= */

document.getElementById(
    "galeriaPendiente"
).onclick =
    function(event) {

        event.preventDefault();

        alert(
            "📷 La galería estará disponible próximamente."
        );

    };


/* =========================
   AGREGAR CANCHA
========================= */

const agregarCancha =
    document.getElementById(
        "agregarCancha"
    );


agregarCancha.onclick =
    function(event) {


        event.preventDefault();


        sideMenu.classList.remove(
            "open"
        );

        overlay.classList.remove(
            "show"
        );


        alert(
            "📍 Busca la cancha en el mapa y toca su ubicación exacta."
        );


        map.once(

            "click",

            function(e) {


                const latitud =
                    e.latlng.lat;

                const longitud =
                    e.latlng.lng;


                const marcadorTemporal =
                    L.marker(

                        [
                            latitud,
                            longitud
                        ],

                        {

                            icon:
                                basketballIcon,

                            draggable:
                                true

                        }

                    ).addTo(map);


                marcadorTemporal.bindPopup(`

                    <div style="
                        text-align:center;
                        width:190px;
                        font-family:Arial,sans-serif;
                    ">

                        <strong>
                            🏀 Nueva cancha
                        </strong>

                        <p style="
                            font-size:13px;
                            margin:10px 0;
                        ">
                            ¿Es esta la ubicación correcta?
                        </p>


                        <button
                            id="confirmarUbicacion"
                            style="
                                width:100%;
                                border:none;
                                padding:10px;
                                margin-bottom:7px;
                                border-radius:8px;
                                background:#222;
                                color:white;
                                font-weight:bold;
                                cursor:pointer;
                            "
                        >
                            CONFIRMAR UBICACIÓN →
                        </button>


                        <button
                            id="quitarBalon"
                            style="
                                width:100%;
                                border:1px solid #ccc;
                                padding:8px;
                                border-radius:8px;
                                background:white;
                                color:#222;
                                cursor:pointer;
                            "
                        >
                            ✕ Quitar balón
                        </button>

                    </div>

                `);


                marcadorTemporal.openPopup();


                const popup =
                    marcadorTemporal
                        .getPopup()
                        .getElement();


                const botonQuitar =
                    popup.querySelector(
                        "#quitarBalon"
                    );


                const botonConfirmar =
                    popup.querySelector(
                        "#confirmarUbicacion"
                    );


                botonQuitar.onclick =
                    function() {

                        map.removeLayer(
                            marcadorTemporal
                        );

                    };


                botonConfirmar.onclick =
                    function() {


                        const posicion =
                            marcadorTemporal
                                .getLatLng();


                        localStorage.setItem(

                            "nuevaCanchaUbicacion",

                            JSON.stringify({

                                latitud:
                                    posicion.lat,

                                longitud:
                                    posicion.lng

                            })

                        );


                        window.location.href =
                            "agregar-cancha.html";

                    };

            }

        );

    };


/* =========================
   CERRAR SESIÓN
========================= */

const cerrarSesion =
    document.getElementById(
        "cerrarSesion"
    );


cerrarSesion.onclick =
    async function(event) {


        event.preventDefault();


        await supabaseClient.auth
            .signOut();


        window.location.replace(
            "index.html"
        );

    };


</script>

</body>
</html>
