<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Basketball Passport</title>

    <!-- LEAFLET -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #f5f5f2;
        }

        /* ENCABEZADO */

        #titulo {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            background: #f5f5f2;
        }

        /* MAPA */

        #map {
            width: 100%;
            height: calc(100vh - 142px);
        }

        /* PELOTA DEL MAPA */

        .basketball {
            font-size: 32px;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,.25));
        }

        /* BARRA INFERIOR */

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 72px;

            background: white;

            display: flex;
            justify-content: space-around;
            align-items: center;

            border-top: 1px solid #ddd;

            z-index: 1000;
        }

        .nav-item {
            flex: 1;
            text-align: center;

            font-size: 10px;
            color: #777;

            text-decoration: none;
        }

        .nav-icon {
            display: block;
            font-size: 23px;
            margin-bottom: 4px;
        }

        .nav-item.active {
            color: #000;
            font-weight: bold;
        }

    </style>

</head>


<body>


    <!-- ENCABEZADO -->

    <div id="titulo">
        🏀 BASKETBALL PASSPORT
