<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar cancha | Basketball Passport</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .contenedor {
            max-width: 520px;
            margin: auto;
            padding: 22px;
            padding-bottom: 50px;
        }

        .volver {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: white;
            text-decoration: none;
            color: #222;
            font-size: 24px;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .subtitulo {
            color: #777;
            margin-bottom: 28px;
        }

        .foto {
            height: 190px;
            background: #e8e8e8;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            font-size: 42px;
            overflow: hidden;
            cursor: pointer;
        }

        .foto span {
            font-size: 14px;
            margin-top: 10px;
            color: #666;
        }

        #previewFoto {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #textoFoto {
            text-align: center;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 18px 0 7px;
        }

        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid #ddd;
            background: white;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .fila {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .guardar {
            width: 100%;
            margin-top: 28px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: #222;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .eliminar {
            width: 100%;
            margin-top: 12px;
            padding: 15px;
            border: 1px solid #d6d6d6;
            border-radius: 12px;
            background: white;
            color: #b42318;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

    </style>
</head>

<body>

<div class="contenedor">

    <a href="cancha.html" class="volver">←</a>

    <h1>Editar cancha 🏀</h1>

    <div class="subtitulo">
        Guarda los recuerdos de esta cancha.
    </div>


    <!-- FOTO -->

    <div
        class="foto"
        id="vistaFoto"
        onclick="document.getElementById('fotoCancha').click()"
    >

        <img id="previewFoto">

        <div id="textoFoto">
            📷
            <br>
            <span>Agregar foto</span>
        </div>

    </div>


    <input
        type="file"
        id="fotoCancha"
        accept="image/*"
        style="display:none;"
    >


    <!-- DATOS -->

    <label>Nombre de la cancha</label>

    <input
        id="nombre"
        type="text"
    >


    <label>Ubicación</label>

    <input
        id="ubicacion"
        type="text"
    >


    <label>Calificación</label>

    <select id="estrellas">

        <option value="5">⭐⭐⭐⭐⭐</option>
        <option value="4">⭐⭐⭐⭐</option>
        <option value="3">⭐⭐⭐</option>
        <option value="2">⭐⭐</option>
        <option value="1">⭐</option>

    </select>


    <label>Fecha de visita</label>

    <input
        id="fecha"
        type="date"
    >


    <div class="fila">

        <div>
            <label>Partidos</label>
            <input
                id="partidos"
                type="number"
                min="0"
            >
        </div>

        <div>
            <label>Victorias</label>
            <input
                id="victorias"
                type="number"
                min="0"
            >
        </div>

        <div>
            <label>Derrotas</label>
            <input
                id="derrotas"
                type="number"
                min="0"
            >
        </div>

        <div>
            <label>Puntos</label>
            <input
                id="puntos"
                type="number"
                min="0"
            >
        </div>

    </div>


    <label>Mi recuerdo</label>

    <textarea id="recuerdo"></textarea>


    <button
        class="guardar"
        id="guardarCambios"
        type="button"
    >
        GUARDAR CAMBIOS
    </button>


    <button
        class="eliminar"
        id="eliminarCancha"
        type="button"
    >
        🗑 ELIMINAR CANCHA
    </button>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://mybctirrilqkucnkaztx.supabase.co/";

const SUPABASE_KEY =
    "sb_publishable_tDdp8eOCmHOJJIfVm2WdHA_M3Q962Mc";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   BUSCAR CANCHA
========================= */

const canchaSeleccionada =
    localStorage.getItem(
        "canchaSeleccionada"
    );


let canchas =
    JSON.parse(
        localStorage.getItem(
            "canchasBasketballPassport"
        )
    ) || [];


const indiceCancha =
    canchas.findIndex(function(cancha) {

        return String(cancha.id) ===
               String(canchaSeleccionada);

    });


if (indiceCancha === -1) {

    alert("No se encontró esta cancha.");

    window.location.href =
        "mapa.html";

}


let datosCancha =
    canchas[indiceCancha];


/* =========================
   CARGAR DATOS
========================= */

if (datosCancha) {

    document.getElementById(
        "nombre"
    ).value =
        datosCancha.nombre || "";


    document.getElementById(
        "ubicacion"
    ).value =
        datosCancha.ubicacion || "";


    document.getElementById(
        "estrellas"
    ).value =
        String(datosCancha.estrellas || 5);


    document.getElementById(
        "fecha"
    ).value =
        datosCancha.fecha || "";


    document.getElementById(
        "partidos"
    ).value =
        datosCancha.partidos || 0;


    document.getElementById(
        "victorias"
    ).value =
        datosCancha.victorias || 0;


    document.getElementById(
        "derrotas"
    ).value =
        datosCancha.derrotas || 0;


    document.getElementById(
        "puntos"
    ).value =
        datosCancha.puntos || 0;


    document.getElementById(
        "recuerdo"
    ).value =
        datosCancha.recuerdo || "";


    /* FOTO EXISTENTE */

    if (datosCancha.foto) {

        const previewFoto =
            document.getElementById(
                "previewFoto"
            );

        previewFoto.src =
            datosCancha.foto;

        previewFoto.style.display =
            "block";

        document.getElementById(
            "textoFoto"
        ).style.display =
            "none";

    }

}


/* =========================
   SUBIR FOTO
========================= */

document.getElementById(
    "fotoCancha"
).addEventListener(
    "change",
    async function() {


        const archivo =
            this.files[0];


        if (!archivo) {
            return;
        }


        const nombreArchivo =
            Date.now() +
            "-" +
            archivo.name;


        const {
            data,
            error
        } =
            await supabaseClient.storage

                .from("fotos-canchas")

                .upload(
                    nombreArchivo,
                    archivo
                );


        if (error) {

            alert(
                "No se pudo subir la foto: " +
                error.message
            );

            return;

        }


        const { data: urlData } =
            supabaseClient.storage

                .from("fotos-canchas")

                .getPublicUrl(
                    nombreArchivo
                );


        /* Guardar URL en la cancha */

        datosCancha.foto =
            urlData.publicUrl;


        /* Mostrar preview */

        const previewFoto =
            document.getElementById(
                "previewFoto"
            );


        previewFoto.src =
            URL.createObjectURL(
                archivo
            );


        previewFoto.style.display =
            "block";


        document.getElementById(
            "textoFoto"
        ).style.display =
            "none";


        alert(
            "¡Foto subida correctamente! 🏀📷"
        );

    }
);


/* =========================
   GUARDAR CAMBIOS
========================= */

document.getElementById(
    "guardarCambios"
).onclick = function() {


    datosCancha.nombre =
        document.getElementById(
            "nombre"
        ).value.trim();


    datosCancha.ubicacion =
        document.getElementById(
            "ubicacion"
        ).value.trim();


    datosCancha.estrellas =
        Number(
            document.getElementById(
                "estrellas"
            ).value
        );


    datosCancha.fecha =
        document.getElementById(
            "fecha"
        ).value;


    datosCancha.partidos =
        Number(
            document.getElementById(
                "partidos"
            ).value || 0
        );


    datosCancha.victorias =
        Number(
            document.getElementById(
                "victorias"
            ).value || 0
        );


    datosCancha.derrotas =
        Number(
            document.getElementById(
                "derrotas"
            ).value || 0
        );


    datosCancha.puntos =
        Number(
            document.getElementById(
                "puntos"
            ).value || 0
        );


    datosCancha.recuerdo =
        document.getElementById(
            "recuerdo"
        ).value.trim();


    /* Actualizar cancha */

    canchas[indiceCancha] =
        datosCancha;


    /* Guardar */

    localStorage.setItem(

        "canchasBasketballPassport",

        JSON.stringify(canchas)

    );


    window.location.href =
        "cancha.html";

};


/* =========================
   ELIMINAR CANCHA
========================= */

document.getElementById(
    "eliminarCancha"
).onclick = function() {


    const confirmar =
        window.confirm(

            "¿Seguro que quieres eliminar esta cancha?\n\n" +

            "Esta acción no se puede deshacer."

        );


    if (!confirmar) {
        return;
    }


    /* Eliminar solamente esta cancha */

    canchas =
        canchas.filter(function(cancha) {

            return String(cancha.id) !==
                   String(canchaSeleccionada);

        });


    /* Guardar nueva lista */

    localStorage.setItem(

        "canchasBasketballPassport",

        JSON.stringify(canchas)

    );


    /* Limpiar selección */

    localStorage.removeItem(
        "canchaSeleccionada"
    );


    /* Volver al mapa */

    window.location.href =
        "mapa.html";

};

</script>

</body>
</html>
