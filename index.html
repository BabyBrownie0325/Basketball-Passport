<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Basketball Passport</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

.passport {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
}

.passport video {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* Los botones son invisibles y aparecen al terminar el video */

.hotspot {
    position: absolute;
    left: 12%;
    width: 76%;
    z-index: 10;
    display: none;
    cursor: pointer;
}

/* ABRIR MI PASAPORTE */
#abrir {
    top: 58%;
    height: 7%;
}

/* CREAR MI PASAPORTE */
#crear {
    top: 68%;
    height: 7%;
}

</style>
</head>

<body>

<div class="passport">

    <video id="intro" autoplay muted playsinline>
        <source src="basketball-passport.mp4" type="video/mp4">
    </video>

    <a id="abrir" class="hotspot" href="login.html"
       aria-label="Abrir mi pasaporte"></a>

    <a id="crear" class="hotspot" href="registro.html"
       aria-label="Crear mi pasaporte"></a>

</div>

<script>

const video = document.getElementById("intro");
const abrir = document.getElementById("abrir");
const crear = document.getElementById("crear");

video.addEventListener("ended", function() {
    abrir.style.display = "block";
    crear.style.display = "block";
});

</script>

</body>
</html>
