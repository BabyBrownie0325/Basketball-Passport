<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cancha | Basketball Passport</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .pagina {
            max-width: 500px;
            margin: auto;
            min-height: 100vh;
            background: white;
            padding-bottom: 35px;
        }

        /* FOTO */

        .foto-cancha {
            height: 260px;
            background: #e8e8e8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 65px;
            position: relative;
        }

        .volver {
            position: absolute;
            top: 18px;
            left: 18px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.92);
            font-size: 24px;
            cursor: pointer;
        }

        /* INFORMACIÓN */

        .contenido {
            padding: 24px;
        }

        .titulo {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .ubicacion {
            color: #666;
            font-size: 16px;
            margin-bottom: 14px;
        }

        .estrellas {
            font-size: 28px;
            margin-bottom: 22px;
        }

        .fecha {
            background: #f2f2f2;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 24px;
        }

        /* ESTADÍSTICAS */

        .titulo-seccion {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .estadisticas {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 26px;
        }

        .estadistica {
            background: #f4f4f4;
            border-radius: 12px;
            padding: 17px 10px;
            text-align: center;
        }

        .numero {
            display: block;
            font-size: 25px;
            font-weight: bold;
        }

        .etiqueta {
            font-size: 13px;
            color: #666;
        }

        /* RECUERDO */

        .comentario {
            background: #f4f4f4;
            border-radius: 12px;
            padding: 17px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* BOTÓN */

        .editar {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 15px;
            background: #222;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

    </style>
</head>

<body>

<div class="pagina">

    <!-- FOTO DE LA CANCHA -->

    <div class="foto-cancha">

        <button class="volver"
                onclick="window.location.href='mapa.html'">
            ←
        </button>

        📷

    </div>


    <div class="contenido">

        <div class="titulo" id="nombreCancha">
    Cancha de prueba 🏀
</div>

        <div class="ubicacion" id="ubicacionCancha">
    📍 Caracas, Venezuela
</div>

        <div class="estrellas" id="estrellasCancha">
    ★★★★★
</div>


        <div class="fecha" id="fechaCancha">
    📅 Visitada el 23 de septiembre de 2026
</div>


        <div class="titulo-seccion">
            Mis partidos
        </div>

        <div class="estadisticas">

            <div class="estadistica">
                <span class="numero" id="partidosCancha">12</span>
            </div>

            <div class="estadistica">
               <span class="numero" id="victoriasCancha">8</span>
            </div>

            <div class="estadistica">
               <span class="numero" id="derrotasCancha">4</span>
            </div>

            <div class="estadistica">
                <span class="numero" id="puntosCancha">96</span>
            </div>

        </div>


        <div class="titulo-seccion">
            Mi recuerdo
        </div>

        <div class="comentario" id="recuerdoCancha">
    Gran cancha. Uno de mis lugares favoritos para jugar con los panas. 🏀
</div>


        <button class="editar" onclick="window.location.href='editar-cancha.html'">
    EDITAR CANCHA
</button>

    </div>

</div>
<script>
   const datosGuardados = localStorage.getItem("canchaEjemplo");

if (datosGuardados) {
    const datosCancha = JSON.parse(datosGuardados);

    document.getElementById("recuerdoCancha").textContent =
        datosCancha.recuerdo;
}

        document.getElementById("nombreCancha").textContent =
            datosCancha.nombre + " 🏀";

        document.getElementById("ubicacionCancha").textContent =
            "📍 " + datosCancha.ubicacion;

        document.getElementById("estrellasCancha").textContent =
            "★".repeat(Number(datosCancha.estrellas));

        document.getElementById("fechaCancha").textContent =
            "📅 Visitada el " + datosCancha.fecha;

        document.getElementById("partidosCancha").textContent =
            datosCancha.partidos;

        document.getElementById("victoriasCancha").textContent =
            datosCancha.victorias;

        document.getElementById("derrotasCancha").textContent =
            datosCancha.derrotas;

        document.getElementById("puntosCancha").textContent =
            datosCancha.puntos;
    }
</script>
</body>
</html>
