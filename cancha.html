<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cancha | Basketball Passport</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .pagina {
            max-width: 500px;
            margin: auto;
            min-height: 100vh;
            background: white;
            padding-bottom: 35px;
        }

        /* FOTO */

        .foto-cancha {
            height: 260px;
            background: #e8e8e8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 65px;
            position: relative;
            overflow: hidden;
        }

        .foto-placeholder {
            font-size: 65px;
        }

        #fotoCanchaGuardada {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .volver {
            position: absolute;
            top: 18px;
            left: 18px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.92);
            font-size: 24px;
            cursor: pointer;
            z-index: 10;
        }

        /* INFORMACIÓN */

        .contenido {
            padding: 24px;
        }

        .titulo {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .ubicacion {
            color: #666;
            font-size: 16px;
            margin-bottom: 14px;
        }

        .estrellas {
            font-size: 28px;
            margin-bottom: 22px;
        }

        .fecha {
            background: #f2f2f2;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 24px;
        }

        /* ESTADÍSTICAS */

        .titulo-seccion {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .estadisticas {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 26px;
        }

        .estadistica {
            background: #f4f4f4;
            border-radius: 12px;
            padding: 17px 10px;
            text-align: center;
        }

        .numero {
            display: block;
            font-size: 25px;
            font-weight: bold;
        }

        .etiqueta {
            display: block;
            margin-top: 4px;
            font-size: 13px;
            color: #666;
        }

        /* RECUERDO */

        .comentario {
            background: #f4f4f4;
            border-radius: 12px;
            padding: 17px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* BOTONES */

        .editar {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 15px;
            background: #222;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .eliminar {
            width: 100%;
            border: 1px solid #d7d7d7;
            border-radius: 12px;
            padding: 15px;
            margin-top: 12px;
            background: white;
            color: #b42318;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

    </style>
</head>

<body>

<div class="pagina">

    <!-- FOTO DE LA CANCHA -->

    <div class="foto-cancha">

        <button
            class="volver"
            onclick="window.location.href='mapa.html'">
            ←
        </button>

        <div
            class="foto-placeholder"
            id="fotoPlaceholder">
            🏀
        </div>

        <img
            id="fotoCanchaGuardada"
            alt="Foto de la cancha">

    </div>


    <div class="contenido">

        <div
            class="titulo"
            id="nombreCancha">
            Cancha 🏀
        </div>

        <div
            class="ubicacion"
            id="ubicacionCancha">
            📍 Ubicación
        </div>

        <div
            class="estrellas"
            id="estrellasCancha">
        </div>


        <div
            class="fecha"
            id="fechaCancha">
            📅 Sin fecha registrada
        </div>


        <div class="titulo-seccion">
            Mis partidos
        </div>

        <div class="estadisticas">

            <div class="estadistica">
                <span
                    class="numero"
                    id="partidosCancha">0</span>

                <span class="etiqueta">
                    Partidos
                </span>
            </div>

            <div class="estadistica">
                <span
                    class="numero"
                    id="victoriasCancha">0</span>

                <span class="etiqueta">
                    Victorias
                </span>
            </div>

            <div class="estadistica">
                <span
                    class="numero"
                    id="derrotasCancha">0</span>

                <span class="etiqueta">
                    Derrotas
                </span>
            </div>

            <div class="estadistica">
                <span
                    class="numero"
                    id="puntosCancha">0</span>

                <span class="etiqueta">
                    Puntos
                </span>
            </div>

        </div>


        <div class="titulo-seccion">
            Mi recuerdo
        </div>

        <div
            class="comentario"
            id="recuerdoCancha">
            Sin recuerdos registrados todavía.
        </div>


        <button
            class="editar"
            id="editarCancha">
            EDITAR CANCHA
        </button>


        <button
            class="eliminar"
            id="eliminarCancha">
            🗑️ ELIMINAR CANCHA
        </button>

    </div>

</div>


<script>

/* =========================
   BUSCAR CANCHA SELECCIONADA
========================= */

const canchaSeleccionada =
    localStorage.getItem("canchaSeleccionada");

const canchas =
    JSON.parse(
        localStorage.getItem(
            "canchasBasketballPassport"
        )
    ) || [];


/* Buscar por ID */

const datosCancha =
    canchas.find(function(cancha) {

        return String(cancha.id) ===
               String(canchaSeleccionada);

    });


/* =========================
   MOSTRAR INFORMACIÓN
========================= */

if (datosCancha) {

    document.getElementById(
        "nombreCancha"
    ).textContent =
        (datosCancha.nombre || "Cancha") +
        " 🏀";


    document.getElementById(
        "ubicacionCancha"
    ).textContent =
        "📍 " +
        (datosCancha.ubicacion ||
        "Ubicación no registrada");


    document.getElementById(
        "estrellasCancha"
    ).textContent =
        "★".repeat(
            Number(datosCancha.estrellas || 0)
        );


    if (datosCancha.fecha) {

        document.getElementById(
            "fechaCancha"
        ).textContent =
            "📅 Visitada el " +
            datosCancha.fecha;

    }


    document.getElementById(
        "partidosCancha"
    ).textContent =
        datosCancha.partidos || 0;


    document.getElementById(
        "victoriasCancha"
    ).textContent =
        datosCancha.victorias || 0;


    document.getElementById(
        "derrotasCancha"
    ).textContent =
        datosCancha.derrotas || 0;


    document.getElementById(
        "puntosCancha"
    ).textContent =
        datosCancha.puntos || 0;


    if (datosCancha.recuerdo) {

        document.getElementById(
            "recuerdoCancha"
        ).textContent =
            datosCancha.recuerdo;

    }


    /* FOTO */

    if (datosCancha.foto) {

        const imagen =
            document.getElementById(
                "fotoCanchaGuardada"
            );

        imagen.src =
            datosCancha.foto;

        imagen.style.display =
            "block";

        document.getElementById(
            "fotoPlaceholder"
        ).style.display =
            "none";

    }

}


/* =========================
   EDITAR CANCHA
========================= */

document.getElementById(
    "editarCancha"
).onclick = function() {

    if (!datosCancha) {
        return;
    }

    localStorage.setItem(
        "canchaSeleccionada",
        datosCancha.id
    );

    window.location.href =
        "editar-cancha.html";

};


/* =========================
   ELIMINAR CANCHA
========================= */

document.getElementById(
    "eliminarCancha"
).onclick = function() {

    if (!datosCancha) {
        return;
    }


    const confirmar =
        window.confirm(
            "¿Seguro que quieres eliminar esta cancha?\n\nEsta acción no se puede deshacer."
        );


    if (!confirmar) {
        return;
    }


    const nuevasCanchas =
        canchas.filter(function(cancha) {

            return String(cancha.id) !==
                   String(datosCancha.id);

        });


    localStorage.setItem(
        "canchasBasketballPassport",
        JSON.stringify(nuevasCanchas)
    );


    localStorage.removeItem(
        "canchaSeleccionada"
    );


    window.location.href =
        "mapa.html";

};

</script>

</body>
</html>
