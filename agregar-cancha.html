<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agregar cancha | Basketball Passport</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .pagina {
            max-width: 650px;
            margin: auto;
            padding: 28px 22px 50px;
        }

        .volver {
            width: 52px;
            height: 52px;
            border: none;
            border-radius: 50%;
            background: white;
            font-size: 28px;
            cursor: pointer;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 38px;
            margin: 0 0 8px;
        }

        .subtitulo {
            color: #777;
            font-size: 18px;
            margin-bottom: 28px;
        }

        /* FOTO */

        .foto {
            width: 100%;
            height: 210px;
            background: #e8e8e8;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            overflow: hidden;
            cursor: pointer;
        }

        #textoFoto {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 46px;
        }

        #textoFoto span {
            font-size: 15px;
            margin-top: 10px;
            color: #666;
        }

        #previewFoto {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* UBICACIÓN */

        .ubicacion-confirmada {
            background: #eeeeee;
            border-radius: 14px;
            padding: 12px 15px;
            margin-bottom: 25px;
            font-size: 14px;
            color: #555;
        }

        /* CAMPOS */

        .campo {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 9px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 16px;
            border: 1px solid #d5d5d5;
            border-radius: 16px;
            background: white;
            font-size: 17px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .fila {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        /* GUARDAR */

        .guardar {
            width: 100%;
            border: none;
            border-radius: 18px;
            background: #222;
            color: white;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .guardar:disabled {
            opacity: 0.6;
            cursor: default;
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

<div class="pagina">

    <button
        class="volver"
        type="button"
        onclick="window.location.href='mapa.html'">
        ←
    </button>

    <h1>Nueva cancha 🏀</h1>

    <div class="subtitulo">
        Agrega un nuevo lugar a tu Basketball Passport.
    </div>

    <!-- FOTO -->

    <div
        class="foto"
        id="vistaFoto"
        onclick="document.getElementById('fotoCancha').click()">

        <img
            id="previewFoto"
            alt="Foto de la cancha">

        <div id="textoFoto">
            📷
            <span>Agregar foto</span>
        </div>

    </div>

    <input
        type="file"
        id="fotoCancha"
        accept="image/*"
        style="display:none;">

    <!-- UBICACIÓN SELECCIONADA -->

    <div
        class="ubicacion-confirmada"
        id="ubicacionConfirmada">
        📍 Ubicación seleccionada en el mapa
    </div>

    <div class="campo">
        <label>Nombre de la cancha</label>

        <input
            id="nombre"
            type="text"
            placeholder="Ej. Cancha Los Próceres">
    </div>

    <div class="campo">
        <label>Ubicación</label>

        <input
            id="ubicacion"
            type="text"
            placeholder="Ej. Caracas, Venezuela">
    </div>

    <div class="campo">
        <label>Calificación</label>

        <select id="estrellas">
            <option value="5">⭐⭐⭐⭐⭐</option>
            <option value="4">⭐⭐⭐⭐</option>
            <option value="3">⭐⭐⭐</option>
            <option value="2">⭐⭐</option>
            <option value="1">⭐</option>
        </select>
    </div>

    <div class="campo">
        <label>Fecha de visita</label>
        <input id="fecha" type="date">
    </div>

    <div class="campo">

        <label>Mis partidos</label>

        <div class="fila">

            <input
                id="partidos"
                type="number"
                min="0"
                placeholder="Partidos">

            <input
                id="victorias"
                type="number"
                min="0"
                placeholder="Victorias">

            <input
                id="derrotas"
                type="number"
                min="0"
                placeholder="Derrotas">

            <input
                id="puntos"
                type="number"
                min="0"
                placeholder="Puntos">

        </div>
    </div>

    <div class="campo">

        <label>Mi recuerdo</label>

        <textarea
            id="recuerdo"
            placeholder="¿Qué recuerdas de esta cancha?"></textarea>

    </div>

    <button
        class="guardar"
        id="guardarCancha"
        type="button">
        GUARDAR EN MI PASAPORTE
    </button>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://mybctirrilqkucnkaztx.supabase.co/";

const SUPABASE_KEY =
    "sb_publishable_tDdp8eOCmHOJJIfVm2WdHA_M3Q962Mc";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   COMPROBAR SESIÓN
========================= */

async function comprobarSesion() {

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {

        window.location.replace(
            "login.html"
        );

    }

}

comprobarSesion();


/* =========================
   UBICACIÓN ELEGIDA
========================= */

const ubicacionTemporal =
    localStorage.getItem(
        "nuevaCanchaUbicacion"
    );

let coordenadas = null;

if (ubicacionTemporal) {

    try {

        coordenadas =
            JSON.parse(
                ubicacionTemporal
            );

    } catch(error) {

        coordenadas = null;

    }

}

if (
    !coordenadas ||
    coordenadas.latitud == null ||
    coordenadas.longitud == null
) {

    alert(
        "Primero selecciona la ubicación de la cancha en el mapa. 🏀"
    );

    window.location.replace(
        "mapa.html"
    );

}


/* =========================
   FOTO PRIVADA
========================= */

let fotoPath = "";

let subiendoFoto = false;


document.getElementById(
    "fotoCancha"
).addEventListener(
    "change",
    async function() {

        const archivo =
            this.files[0];

        if (!archivo) {
            return;
        }


        /* VISTA PREVIA LOCAL */

        const previewFoto =
            document.getElementById(
                "previewFoto"
            );

        const textoFoto =
            document.getElementById(
                "textoFoto"
            );

        previewFoto.src =
            URL.createObjectURL(
                archivo
            );

        previewFoto.style.display =
            "block";

        textoFoto.style.display =
            "none";


        /* SUBIR A SUPABASE */

        subiendoFoto = true;

        const nombreSeguro =
            archivo.name.replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
            );

        const nombreArchivo =
            Date.now() +
            "-" +
            nombreSeguro;


        const {
            data,
            error
        } =
            await supabaseClient.storage
                .from("fotos-canchas")
                .upload(
                    nombreArchivo,
                    archivo
                );


        subiendoFoto = false;


        if (error) {

            fotoPath = "";

            previewFoto.style.display =
                "none";

            textoFoto.style.display =
                "flex";

            alert(
                "No se pudo subir la foto: " +
                error.message
            );

            return;

        }


        fotoPath =
            data.path;


        alert(
            "¡Foto agregada correctamente! 🏀📷"
        );

    }

);


/* =========================
   GUARDAR CANCHA
========================= */

const botonGuardar =
    document.getElementById(
        "guardarCancha"
    );


botonGuardar.addEventListener(
    "click",
    function() {


        if (subiendoFoto) {

            alert(
                "Espera un momento, la foto todavía se está subiendo. 📷"
            );

            return;

        }


        const nombre =
            document.getElementById(
                "nombre"
            ).value.trim();


        const ubicacion =
            document.getElementById(
                "ubicacion"
            ).value.trim();


        if (!nombre || !ubicacion) {

            alert(
                "Escribe el nombre y la ubicación de la cancha."
            );

            return;

        }


        if (
            !coordenadas ||
            coordenadas.latitud == null ||
            coordenadas.longitud == null
        ) {

            alert(
                "No se encontró la ubicación seleccionada en el mapa."
            );

            window.location.href =
                "mapa.html";

            return;

        }


        const nuevaCancha = {

            id:
                Date.now(),

            nombre:
                nombre,

            ubicacion:
                ubicacion,

            latitud:
                Number(
                    coordenadas.latitud
                ),

            longitud:
                Number(
                    coordenadas.longitud
                ),

            estrellas:
                Number(
                    document.getElementById(
                        "estrellas"
                    ).value
                ),

            fecha:
                document.getElementById(
                    "fecha"
                ).value,

            partidos:
                Number(
                    document.getElementById(
                        "partidos"
                    ).value || 0
                ),

            victorias:
                Number(
                    document.getElementById(
                        "victorias"
                    ).value || 0
                ),

            derrotas:
                Number(
                    document.getElementById(
                        "derrotas"
                    ).value || 0
                ),

            puntos:
                Number(
                    document.getElementById(
                        "puntos"
                    ).value || 0
                ),

            recuerdo:
                document.getElementById(
                    "recuerdo"
                ).value.trim(),

            foto:
                "",

            fotoPath:
                fotoPath

        };


        let canchas =
            JSON.parse(
                localStorage.getItem(
                    "canchasBasketballPassport"
                )
            ) || [];


        /* =========================
           COMPROBAR NUEVO LOGRO
        ========================= */

        const cantidadAnterior =
            canchas.length;


        canchas.push(
            nuevaCancha
        );


        const cantidadNueva =
            canchas.length;


        localStorage.setItem(

            "canchasBasketballPassport",

            JSON.stringify(
                canchas
            )

        );


        /*
           Si esta cancha hizo que pasáramos
           de menos de 5 a 5 o más,
           dejamos pendiente la celebración.
        */

        if (
            cantidadAnterior < 5 &&
            cantidadNueva >= 5
        ) {

            const logrosCelebrados =
                JSON.parse(
                    localStorage.getItem(
                        "logrosCelebradosBasketballPassport"
                    )
                ) || [];


            if (
                !logrosCelebrados.includes(
                    "explorador5"
                )
            ) {

                localStorage.setItem(
                    "celebracionPendienteBasketballPassport",
                    "explorador5"
                );

            }

        }


        localStorage.removeItem(
            "nuevaCanchaUbicacion"
        );


        localStorage.setItem(
            "canchaSeleccionada",
            nuevaCancha.id
        );


        alert(
            "¡Cancha agregada a tu pasaporte! 🏀"
        );


        window.location.href =
            "mapa.html";

    }

);

</script>

</body>
</html>
