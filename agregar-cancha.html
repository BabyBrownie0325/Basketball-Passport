<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agregar cancha | Basketball Passport</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .pagina {
            max-width: 650px;
            margin: auto;
            padding: 28px 22px 50px;
        }

        .volver {
            width: 52px;
            height: 52px;
            border: none;
            border-radius: 50%;
            background: white;
            font-size: 28px;
            cursor: pointer;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 38px;
            margin: 0 0 8px;
        }

        .subtitulo {
            color: #777;
            font-size: 18px;
            margin-bottom: 32px;
        }

        .campo {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 9px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 16px;
            border: 1px solid #d5d5d5;
            border-radius: 16px;
            background: white;
            font-size: 17px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .fila {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .guardar {
            width: 100%;
            border: none;
            border-radius: 18px;
            background: #222;
            color: white;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

<div class="pagina">

    <button class="volver"
            onclick="window.location.href='mapa.html'">
        ←
    </button>

    <h1>Nueva cancha 🏀</h1>

    <div class="subtitulo">
        Agrega un nuevo lugar a tu Basketball Passport.
    </div>

    <div class="campo">
        <label>Nombre de la cancha</label>
        <input id="nombre"
               type="text"
               placeholder="Ej. Cancha Los Próceres">
    </div>

    <div class="campo">
        <label>Ubicación</label>
        <input id="ubicacion"
               type="text"
               placeholder="Ej. Caracas, Venezuela">
    </div>

    <div class="campo">
        <label>Calificación</label>

        <select id="estrellas">
            <option value="5">⭐⭐⭐⭐⭐</option>
            <option value="4">⭐⭐⭐⭐</option>
            <option value="3">⭐⭐⭐</option>
            <option value="2">⭐⭐</option>
            <option value="1">⭐</option>
        </select>
    </div>

    <div class="campo">
        <label>Fecha de visita</label>
        <input id="fecha" type="date">
    </div>

    <div class="campo">
        <label>Mis partidos</label>

        <div class="fila">
            <input id="partidos"
                   type="number"
                   min="0"
                   placeholder="Partidos">

            <input id="victorias"
                   type="number"
                   min="0"
                   placeholder="Victorias">

            <input id="derrotas"
                   type="number"
                   min="0"
                   placeholder="Derrotas">

            <input id="puntos"
                   type="number"
                   min="0"
                   placeholder="Puntos">
        </div>
    </div>

    <div class="campo">
        <label>Mi recuerdo</label>

        <textarea id="recuerdo"
                  placeholder="¿Qué recuerdas de esta cancha?"></textarea>
    </div>

    <button class="guardar" id="guardarCancha">
        GUARDAR EN MI PASAPORTE
    </button>

</div>


<script>

const botonGuardar = document.getElementById("guardarCancha");

botonGuardar.addEventListener("click", async function () {

    const nombre = document.getElementById("nombre").value.trim();
    const ubicacion = document.getElementById("ubicacion").value.trim();

    if (!nombre || !ubicacion) {
        alert("Escribe el nombre y la ubicación de la cancha.");
        return;
    }
    
    const respuesta = await fetch(
    "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
    encodeURIComponent(ubicacion)
);

const resultados = await respuesta.json();

if (resultados.length === 0) {
    alert("No pude encontrar esa ubicación. Intenta escribirla con más detalle, por ejemplo: Caracas, Venezuela.");
    return;
}

const latitud = parseFloat(resultados[0].lat);
const longitud = parseFloat(resultados[0].lon);

    const nuevaCancha = {

        id: Date.now(),

        nombre: nombre,

        ubicacion: ubicacion,
        latitud: latitud,
longitud: longitud,

        estrellas: document.getElementById("estrellas").value,

        fecha: document.getElementById("fecha").value,

        partidos: document.getElementById("partidos").value || "0",

        victorias: document.getElementById("victorias").value || "0",

        derrotas: document.getElementById("derrotas").value || "0",

        puntos: document.getElementById("puntos").value || "0",

        recuerdo: document.getElementById("recuerdo").value,

        foto: ""
    };


    let canchas = JSON.parse(
        localStorage.getItem("canchasBasketballPassport")
    ) || [];


    canchas.push(nuevaCancha);


    localStorage.setItem(
        "canchasBasketballPassport",
        JSON.stringify(canchas)
    );


    alert("¡Cancha agregada a tu pasaporte! 🏀");

    window.location.href = "mapa.html";

});

</script>

</body>
</html>
