<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abrir Basketball Passport</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial, sans-serif;
    background:#f3f5f1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.container{
    width:100%;
    max-width:420px;
    text-align:center;
}

.ball{
    font-size:55px;
    margin-bottom:10px;
}

h1{
    font-size:27px;
    letter-spacing:2px;
    margin-bottom:8px;
}

.subtitle{
    color:#666;
    margin-bottom:35px;
}

.form-group{
    text-align:left;
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:15px;
    border:1px solid #ccd3d6;
    border-radius:15px;
    font-size:16px;
    background:white;
}

button{
    width:100%;
    padding:17px;
    margin-top:10px;
    border:none;
    border-radius:18px;
    background:#c7d4da;
    color:#111;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.register{
    margin-top:25px;
    font-size:14px;
}

.register a{
    color:#111;
    font-weight:bold;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

    <div class="ball">🏀</div>

    <h1>BASKETBALL PASSPORT</h1>

    <p class="subtitle">
        Bienvenido de vuelta.<br>
        Continúa llenando tu mapa.
    </p>

    <form>

        <div class="form-group">
            <label>Correo electrónico</label>
            <input type="email" placeholder="tu@email.com">
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" placeholder="••••••••">
        </div>

       <button type="button" onclick="window.location.href='mapa.html'">
    ABRIR MI PASAPORTE
</button>

    </form>

    <div class="register">
        ¿Primera vez aquí?
        <a href="registro.html">Crear mi pasaporte</a>
    </div>

</div>

</body>
</html>
