<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crear mi Basketball Passport</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial, sans-serif;
    background:#f3f5f1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.container{
    width:100%;
    max-width:420px;
    text-align:center;
}

.ball{
    font-size:55px;
    margin-bottom:10px;
}

h1{
    font-size:27px;
    letter-spacing:2px;
    margin-bottom:8px;
}

.subtitle{
    color:#666;
    margin-bottom:35px;
}

.form-group{
    text-align:left;
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:15px;
    border:1px solid #ccd3d6;
    border-radius:15px;
    font-size:16px;
    background:white;
}

button{
    width:100%;
    padding:17px;
    margin-top:10px;
    border:none;
    border-radius:18px;
    background:#c7d4da;
    color:#111;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.login{
    margin-top:25px;
    font-size:14px;
}

.login a{
    color:#111;
    font-weight:bold;
    text-decoration:none;
}

</style>
</head>

<body>

<div class="container">

    <div class="ball">🏀</div>

    <h1>BASKETBALL PASSPORT</h1>

    <p class="subtitle">
        Tu mapa de canchas comienza aquí.
    </p>

    <form>

        <div class="form-group">
            <label>Nombre o apodo</label>
           <input id="nombre" type="text" placeholder="¿Cómo quieres aparecer?">
        </div>

        <div class="form-group">
            <label>Correo electrónico</label>
            <input id="email" type="email" placeholder="tu@email.com">
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <input id="password" type="password" placeholder="••••••••">
        </div>

        <div class="form-group">
            <label>Confirmar contraseña</label>
            <input id="confirmarPassword" type="password" placeholder="••••••••">
        </div>

        <button type="button" id="crearPasaporte">
            CREAR MI PASAPORTE
        </button>

    </form>

    <div class="login">
        ¿Ya tienes un pasaporte?
        <a href="login.html">Abrir mi pasaporte</a>
    </div>

</div>
<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = "https://mybctirrilqkucnkaztx.supabase.co/";
    const SUPABASE_KEY = "sb_publishable_tDdp8eOCmHOJJIfVm2WdHA_M3Q962Mc";

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    ); document.getElementById("crearPasaporte").addEventListener("click", async function () {

    const nombre = document.getElementById("nombre").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmarPassword = document.getElementById("confirmarPassword").value;

    if (!nombre || !email || !password || !confirmarPassword) {
        alert("Completa todos los campos.");
        return;
    }

    if (password !== confirmarPassword) {
        alert("Las contraseñas no coinciden.");
        return;
    }

    if (password.length < 6) {
        alert("La contraseña debe tener al menos 6 caracteres.");
        return;
    }

    const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
            data: {
                nombre: nombre
            }
        }
    });

    if (error) {
        alert("No se pudo crear el pasaporte: " + error.message);
        return;
    }

    alert("🏀 ¡Tu Basketball Passport fue creado!");

    window.location.href = "mapa.html";
});
</script>
</body>
</html>
